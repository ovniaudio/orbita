name: Build & Validate

# CI de etapa M0–M5: build universal macOS + tests + pluginval.
# Firma (Developer ID), notarización, instalador .pkg y cross-platform
# (Windows/Linux/AAX) se agregan en M6, cuando existan los secrets.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Principio de mínimo privilegio: el workflow solo lee el repo (build + tests + pluginval);
# no publica releases ni escribe contenido. Sube artefactos vía actions/upload-artifact,
# que no requiere permisos de escritura sobre el repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Release

jobs:
  macos:
    name: macOS · build + pluginval
    runs-on: macos-14
    steps:
      - name: Checkout (con submódulos)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Instalar Ninja
        run: brew install ninja

      - name: Configurar (universal arm64 + x86_64)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" .

      - name: Compilar
        run: cmake --build build --config $BUILD_TYPE

      - name: Tests (Catch2)
        working-directory: build
        run: ctest --output-on-failure

      - name: Pluginval (strictness 8)
        run: |
          set -euo pipefail
          # pluginval pineado a una versión fija (no releases/latest) para builds reproducibles.
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip"
          unzip -oq pluginval.zip
          # Resolver el bundle VST3 dinámicamente (igual que el job windows): el PRODUCT_NAME es
          # "ORBIT" (→ ORBIT.vst3) pero la carpeta *_artefacts deriva de PROJECT_NAME="Orbita".
          bundle=$(find build -type d -path '*_artefacts/*/VST3/*.vst3' | head -1)
          echo "pluginval → $bundle"
          ./pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 8 --validate-in-process \
            "$bundle"

      - name: Subir artefactos
        uses: actions/upload-artifact@v7
        with:
          name: ORBIT-macos
          path: |
            build/Orbita_artefacts/${{ env.BUILD_TYPE }}/VST3/ORBIT.vst3
            build/Orbita_artefacts/${{ env.BUILD_TYPE }}/AU/ORBIT.component

  # ---------------------------------------------------------------------------------------------
  # M6 — Windows (VST3). Build MSVC x64 en windows-latest + pluginval strictness 10.
  # Camino A (v1): SIN Intel IPP. PamplejuceIPP.cmake apunta el IPP_ROOT al paquete NuGet
  # intelipp.static.win-x64; como NO lo instalamos, su guard `if (IS_DIRECTORY IPP_ROOT)` da falso
  # y ORBIT compila JUCE puro (la misma ruta que ya corre la slice arm64 en Mac). Cero NuGet.
  # Windows = VST3 (JUCE omite AU; CLAP está deshabilitado). Sin firmar → SmartScreen (ZIP en Release).
  # ---------------------------------------------------------------------------------------------
  windows:
    name: Windows · build + pluginval (VST3, sin IPP)
    # windows-2022 (no windows-latest): el label latest ya rodó a una imagen sin VS 2022 (v17)
    # → el generador "Visual Studio 17 2022" no encuentra instancia. windows-2022 trae VS 2022.
    runs-on: windows-2022
    steps:
      - name: Checkout (con submódulos)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configurar (Visual Studio 2022, x64, sin IPP)
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE .

      - name: Compilar ORBIT (solo VST3)
        run: cmake --build build --config $BUILD_TYPE --target Orbita_VST3

      - name: Verificar PE x64 (COFF machine = AMD64)
        shell: pwsh
        run: |
          # El binario PE vive dentro del bundle en Contents\x86_64-win\ORBIT.vst3.
          $bin = Get-ChildItem -Recurse -File -Path build -Filter *.vst3 |
                 Where-Object { $_.FullName -match 'x86_64-win' } | Select-Object -First 1
          if (-not $bin) { Write-Error "No encontré el binario .vst3 (x86_64-win)"; exit 1 }
          Write-Host "VST3 binary: $($bin.FullName)"
          $bytes   = [System.IO.File]::ReadAllBytes($bin.FullName)
          $peOff   = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOff + 4)
          Write-Host ("COFF machine: 0x{0:X4}" -f $machine)
          if ($machine -ne 0x8664) { Write-Error "No es x64 (esperaba 0x8664)"; exit 1 }
          Write-Host "OK: PE x64 (AMD64)"

      - name: Pluginval (strictness 10)
        run: |
          set -euo pipefail
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip"
          unzip -oq pluginval.zip
          # SOLO el bundle Release: el generador VS crea también un scaffold vacío en Debug/VST3 que
          # haría fallar pluginval con "Num plugins found: 0".
          bundle=$(find build -type d -path '*_artefacts/Release/VST3/*.vst3' | head -1)
          echo "pluginval → $bundle"
          ./pluginval.exe --strictness-level 10 --validate "$bundle"

      - name: Subir artefacto (ORBIT VST3 Windows)
        uses: actions/upload-artifact@v7
        with:
          name: ORBIT-windows-vst3
          path: build/Orbita_artefacts/${{ env.BUILD_TYPE }}/VST3/ORBIT.vst3
